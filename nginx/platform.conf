# ============================================================================
# platform 统一入口 · 三段式 server 块（挂载到 /etc/nginx/conf.d/）
#
# 路由规划（域名就绪前 IP + 路径区分，备案后拆子域 sso./api./www.——规划 P2.5）:
#   /             → skillhub 静态（SPA，纯内存零开销）
#   /api/synapse/ → synapse 后端（重写为内部 /api 前缀）
#   /sso/         → SSO 认证中心（剥掉 /sso 前缀，auth-center 无全局前缀）
#
# 端口:
#   80   跳转 https + ACME 验证（certbot 续期依赖）
#   443  正式入口（Let's Encrypt，P3 起用；备案前可先放自签证书占位）
#   8443 备案期专用——80/443 未备案域名会被阿里云拦截，期间用 IP:8443 + 自签
#        （本地 deploy/nginx 同款 TLS 参数与 HSTS；P3 完成后整块删除）
#
# 注意: cert 文件缺失 nginx 起不来——首启前先放好 certs/self-signed/，
#       P3 再放 certs/fullchain.pem + privkey.pem
# ============================================================================

upstream sso_auth {
    server sso-auth:3000;
    keepalive 16;
}

upstream synapse_api {
    server synapse-api:3100;
    keepalive 16;
}

# ---- 80: ACME 验证 + 强制跳 https ----
server {
    listen 80;
    server_name _;

    # certbot webroot 模式续期（docker run --rm -v /opt/platform/certbot/www:/var/www/certbot \
    #   -v /opt/platform/certs:/etc/letsencrypt certbot/certbot renew --webroot -w /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443: 正式入口 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 生产 2 年（本地演示 1 天口径的正式版；nosniff 等由应用层 helmet 下发）
    add_header Strict-Transport-Security "max-age=63072000" always;

    include /etc/nginx/conf.d/routes.inc;
}

# ---- 8443: 备案期 IP + 自签过渡（P3 完成后整块删除）----
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/self-signed/server.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000" always;

    include /etc/nginx/conf.d/routes.inc;
}
